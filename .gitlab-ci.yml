stages:
  - quality
  - build
  - package
  - loadtest
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: $CI_REGISTRY_IMAGE/student-app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

quality:
  stage: quality
  image: node:18
  script:
    - npm ci
    - npm audit --audit-level=high || true
    - npm test || echo "No tests configured"
  only:
    - main
    - master

build:
  stage: build
  image: node:18
  script:
    - npm ci
    - npm run build || echo "No build script defined"
  only:
    - main
    - master

package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - master

loadtest:
  stage: loadtest
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    - k6 run k6-loadtest.js
  only:
    - main
    - master

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache bash openssh-client docker-cli
    - chmod +x scripts/deploy.sh
  script:
    - ./scripts/deploy.sh
  only:
    - main
    - master
